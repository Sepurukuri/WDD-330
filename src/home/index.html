<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFinder | Home</title>

    <link rel="stylesheet" href="../css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>
<body>

    <header id="mainHeader"></header>

    <main>

        <section class="hero">

            <div class="hero-content">

                <h1>Discover Your Next Favorite Movie</h1>

                <p>
                    Browse trending movies and TV shows from around the world.
                    Search thousands of titles and explore detailed information
                    all in one place.
                </p>

                <div class="search-container">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search movies or TV shows..."
                    >

                    <button id="searchBtn">
                        Search
                    </button>

                </div>

            </div>

        </section>

        <section class="section-container">

            <div class="section-title">

                <h2>Trending Now</h2>

                <p>
                    Popular movies and TV shows everyone is watching.
                </p>

            </div>

            <div
                id="movieContainer"
                class="movie-grid"
            ></div>

        </section>

    </main>

    <footer id="mainFooter"></footer>

    <script
        type="module"
        src="../js/main.mjs"
    ></script>

</body>
</html>
