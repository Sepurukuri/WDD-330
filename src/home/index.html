<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFinder</title>

    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body>

<header>
    <h1>CineFinder</h1>
</header>

<section class="hero">

    <h2>Find Your Next Favorite Movie</h2>

    <p>
        Discover trending movies and television shows from around the world.
    </p>

    <input
        id="searchInput"
        type="text"
        placeholder="Search movies or TV shows..."
    >

    <button id="searchBtn">
        Search
    </button>

</section>

<section>

    <h2>Trending Now</h2>

    <div id="movieContainer" class="movie-grid">

    </div>

</section>

<script type="module" src="../src/js/main.mjs"></script>

</body>
</html>
