<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Movie & TV Recommendation App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/src/css/style.css">

  <script type="module" src="/src/js/main.mjs" defer></script>
</head>

<body>

  <header class="site-header">

    <div class="logo">

      🎬 MovieFinder

    </div>

    <nav>

      <a href="../home/index.html">Home</a>

      <a href="../favorites/index.html">Favorites</a>

    </nav>

  </header>

  <section class="hero">

    <div class="hero-overlay">

      <h1>
        Discover Your Next Favorite Movie
      </h1>

      <p>

        Search thousands of movies and TV shows powered by TMDB.

      </p>

      <div class="search-container">

        <input
          id="searchInput"
          type="text"
          placeholder="Search movies or TV shows..."
        >

        <button id="searchButton">

          Search

        </button>

      </div>

    </div>

  </section>

  <main class="container">

    <section class="toolbar">

      <select id="genreSelect">

        <option value="">All Genres</option>

      </select>

      <select id="sortSelect">

        <option value="popularity.desc">
          Most Popular
        </option>

        <option value="vote_average.desc">
          Highest Rated
        </option>

        <option value="primary_release_date.desc">
          Newest
        </option>

      </select>

    </section>

    <section>

      <h2 class="section-title">

        Trending

      </h2>

      <div
        id="movieGrid"
        class="movie-grid"
      >

      </div>

    </section>

  </main>

  <footer>

    <p>

      Movie & TV Recommendation App • WDD 330

    </p>

  </footer>

</body>
</html>
